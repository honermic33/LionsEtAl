<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lions et al.</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double&family=Doto:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://lionsetal.com/assets/css/style.css"></head><body><header class="site-header"><h1 class="site-title"><a href="https://lionsetal.com/">Lions et al.</a> <img class="pixel-football" src="https://lionsetal.com/assets/images/pixel-football.png" alt="pixel football"></h1><div class="site-subtitle">Notes on The Lions &amp; the rest</div></header><div id="posts"><article class="post"><h2 class="post-title"><a href="https://lionsetal.com/hello-there.html">Hello there.</a></h2><div class="post-meta"><time datetime="2026-08-08T10:09">Aug 8, 2026</time></div><div class="post-content"><figure class="post__image"><img loading="lazy" src="https://lionsetal.com/media/posts/3/LionsEtAl_Post1.jpg" alt="" width="4284" height="5712"></figure></div></article><article class="post"><h2 class="post-title"><a href="https://lionsetal.com/second-test-post.html">Second Test Post</a></h2><div class="post-meta"><time datetime="2026-08-01T15:45">Aug 1, 2026</time></div><div class="post-content"><figure class="post__image"><img loading="lazy" src="https://lionsetal.com/media/posts/2/Second-Test-Post.jpg" alt="" width="4284" height="5712"></figure></div></article><article class="post"><h2 class="post-title"><a href="https://lionsetal.com/test-post.html">Test Post</a></h2><div class="post-meta"><time datetime="2026-08-01T08:41">Aug 1, 2026</time></div><div class="post-content"><figure class="post__image post__image--center"><img loading="lazy" src="https://lionsetal.com/media/posts/1/Page-1-2.jpeg" height="5712" width="4284" alt=""></figure><figure class="post__image post__image--center"><img loading="lazy" src="https://lionsetal.com/media/posts/1/Page-2.jpeg" height="5712" width="4284" alt=""></figure><figure class="post__image post__image--center"><img loading="lazy" src="https://lionsetal.com/media/posts/1/Page-3.jpeg" height="5712" width="4284" alt=""></figure></div></article></div><div id="pagination"></div><div id="infinite-scroll-status"></div><script>(function () {
  var postsContainer = document.getElementById('posts');
  var status = document.getElementById('infinite-scroll-status');
  var loading = false;

  if (!postsContainer) { return; }

  function getNextLink(root) {
    return root.querySelector('#next-page-link');
  }

  function loadNextPage() {
    var link = getNextLink(document);
    if (!link || loading) { return; }
    var url = link.getAttribute('href');
    if (!url) { return; }

    loading = true;
    if (status) { status.textContent = 'loading more entries…'; }

    fetch(url, { credentials: 'include' })
      .then(function (res) { return res.text(); })
      .then(function (html) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');

        var newPosts = doc.getElementById('posts');
        if (newPosts) {
          while (newPosts.firstChild) {
            postsContainer.appendChild(newPosts.firstChild);
          }
        }

        var newPagination = doc.getElementById('pagination');
        var oldPagination = document.getElementById('pagination');
        if (newPagination && oldPagination) {
          oldPagination.innerHTML = newPagination.innerHTML;
        }

        var stillHasNext = getNextLink(document);
        if (status) { status.textContent = stillHasNext ? '' : 'that\'s every entry so far.'; }
        loading = false;
      })
      .catch(function () {
        if (status) { status.textContent = 'couldn\'t load more right now.'; }
        loading = false;
      });
  }

  function nearBottom() {
    return (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 800);
  }

  window.addEventListener('scroll', function () {
    if (nearBottom()) { loadNextPage(); }
  });
})();</script></body></html>
